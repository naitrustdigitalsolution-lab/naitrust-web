<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e90ff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Naitrust is a trusted business payments platform for Nigeria — send instantly when you trust them, or protect a payment with verified terms, evidence, and milestones when you don't."
    />
    <title>Naitrust | Trusted Business Payments</title>
    <link rel="canonical" href="https://naitrust.com/" />

    <!-- Open Graph (defaults for link previews; per-page tags injected at runtime) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Naitrust" />
    <meta property="og:title" content="Naitrust | Trusted Business Payments" />
    <meta
      property="og:description"
      content="Two ways to pay, one trusted platform: send instantly to people and businesses you know, or protect a payment when you're dealing with a new supplier, contractor, agent, or partner."
    />
    <meta property="og:url" content="https://naitrust.com/" />
    <meta property="og:image" content="https://naitrust.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naitrust | Trusted Business Payments" />
    <meta
      name="twitter:description"
      content="Send instantly when you trust them. Protect the payment when you don't. One platform for everyday transfers and protected business payments."
    />
    <meta name="twitter:image" content="https://naitrust.com/og-image.png" />
    <meta name="twitter:site" content="@naitrust14419" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Structured data: who Naitrust is, so Google/Bing/AI search surfaces the
         right facts (brand, contact, social profiles) when "Naitrust" is searched. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://naitrust.com/#organization",
        "name": "Naitrust",
        "legalName": "Naitrust Digital Solutions Limited",
        "alternateName": ["Naitrust Digital Solutions", "NaiTrust"],
        "url": "https://naitrust.com/",
        "logo": "https://naitrust.com/icon-512.png",
        "image": "https://naitrust.com/og-image.png",
        "description": "Naitrust is a trusted business payments platform for Nigeria — instant payments for people and businesses you trust, and protected payments with verified terms, evidence, and milestones for everyone else.",
        "email": "contact@naitrust.com",
        "telephone": "+234-707-587-3258",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Nigeria"
        },
        "knowsAbout": [
          "Business payments",
          "Instant payments Nigeria",
          "Protected payments",
          "Escrow alternative",
          "Fintech",
          "Trust infrastructure",
          "Identity verification",
          "Payment protection",
          "Property transactions"
        ],
        "sameAs": [
          "https://instagram.com/naitrust_digitalsolutions",
          "https://x.com/naitrust14419",
          "https://www.linkedin.com/in/naitrust-digital-solutions"
        ],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "contact@naitrust.com",
            "telephone": "+234-707-587-3258",
            "areaServed": "NG",
            "availableLanguage": ["English"]
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://naitrust.com/#website",
        "url": "https://naitrust.com/",
        "name": "Naitrust",
        "description": "Trusted business payments for Nigeria — instant transfers for people you know, and protected payments with verified terms for everyone else.",
        "publisher": { "@id": "https://naitrust.com/#organization" },
        "inLanguage": "en-NG"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Business payments platform",
        "provider": { "@id": "https://naitrust.com/#organization" },
        "areaServed": {
          "@type": "Country",
          "name": "Nigeria"
        },
        "audience": [
          { "@type": "Audience", "audienceType": "Informal and small business owners" },
          { "@type": "Audience", "audienceType": "Suppliers and wholesalers" },
          { "@type": "Audience", "audienceType": "Contractors and service providers" },
          { "@type": "Audience", "audienceType": "Registered businesses and companies" },
          { "@type": "Audience", "audienceType": "Property buyers, sellers, agents, and developers" }
        ],
        "description": "Instant payments for people and businesses you trust, and protected payments — verified terms, evidence, and milestones — through regulated payment partners for everyone else.",
        "category": ["Fintech", "Business Payments", "Trust Infrastructure", "Escrow Alternative", "Property Technology"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.2/build/spline-viewer.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
